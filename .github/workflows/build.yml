name: Build SUSFS LKM Loader Module

on:
  # 每天 03:00 UTC 检查上游是否有新 release
  schedule:
    - cron: "0 3 * * *"
  # 允许手动触发（可指定上游 tag，留空 = 最新）
  workflow_dispatch:
    inputs:
      tag:
        description: "上游 release tag（留空 = 自动取最新）"
        required: false
        default: ""
  # 封装代码（build.sh / template / 工作流本身）有改动时立即重跑，
  # 以便把修好的模块同步进已存在的 Release 资产。
  push:
    branches: [ main ]
    paths:
      - "build.sh"
      - "template/**"
      - "LICENSE"
      - ".github/workflows/build.yml"

permissions:
  contents: write   # 创建 / 更新 Release 与资产
  issues: write     # 上游更新时创建通知 Issue

concurrency:
  group: susfs-lkm-loader
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build module zip
        id: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHOR: "Odda2632 & TraeCode"
        run: |
          chmod +x build.sh
          ./build.sh "${{ inputs.tag }}" out
          cat out/build-info.env >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: susfs-lkm-loader-${{ steps.build.outputs.tag }}
          path: |
            out/*.zip
            out/provenance-*.json
            out/SHA256SUMS

      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          Auto-built from ${{ steps.build.outputs.upstream_repo }}@${{ steps.build.outputs.tag }}
          (commit `${{ steps.build.outputs.upstream_commit }}`).

          - 上游 LKM 作者：[@inforcqb](https://github.com/inforcqb)，许可 **GPL-2.0**
          - 本封装（打包脚本 / 模块脚本 / 文档）：@Odda2632 & TraeCode，由 AI 协作生成与维护
          - 加载方案参考：[matsuzaka-yuki](https://github.com/matsuzaka-yuki) 的社区 susfs-lkm-module

          - 通用包 `susfs-lkm-loader-${{ steps.build.outputs.tag }}.zip`：含全部 GKI 内核变体，开机按设备 KMI 自动匹配
          - 单变体包 `...-<kmi>.zip`：每个内核变体各一份（如 `android12-5.10`），只含对应 .ko，加载前校验内核串
          - 溯源文件 `provenance-${{ steps.build.outputs.tag }}.json`：记录上游仓库 / tag / commit 及每个 `.ko` 与 `susfs_insmod` 的 sha256

          每个模块 ZIP 内含 `LICENSE`（GPL-2.0 全文）与 `provenance.json`（该包自身的溯源信息）。
          模块在 `late_start`(service.sh) 阶段用自带的 `susfs_insmod` 加载，并带防砖守卫。
          EOF

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "susfs-lkm-loader-${{ steps.build.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Release 不存在 → 新建；已存在 → 覆盖更新资产与说明（这样改封装代码后重跑即可同步）
      - name: Publish or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REL="susfs-lkm-loader-${{ steps.build.outputs.tag }}"
          if [ "${{ steps.check.outputs.exists }}" = "true" ]; then
            echo "==> Release $REL 已存在，覆盖更新资产与说明"
            gh release upload "$REL" out/*.zip out/provenance-*.json out/SHA256SUMS --clobber
            gh release edit "$REL" --notes-file release-notes.md
          else
            echo "==> 新建 Release $REL"
            gh release create "$REL" \
              out/*.zip out/provenance-*.json out/SHA256SUMS \
              --title "SUSFS LKM AutoLoader ${{ steps.build.outputs.tag }}" \
              --notes-file release-notes.md
          fi

      # 仅当这确实是上游新版本（Release 首次创建）时才通知，避免刷屏
      - name: Notify owner (new upstream release)
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "上游新版本已自动构建：${{ steps.build.outputs.tag }}" \
            --body "@${{ github.repository_owner }} 检测到上游 [${{ steps.build.outputs.upstream_repo }}](https://github.com/${{ steps.build.outputs.upstream_repo }}) 发布新版本 \`${{ steps.build.outputs.tag }}\`，已自动打包完成。

          - Release：https://github.com/${{ github.repository }}/releases/tag/susfs-lkm-loader-${{ steps.build.outputs.tag }}
          - 通用包（全部内核变体）：\`susfs-lkm-loader-${{ steps.build.outputs.tag }}.zip\`
          - 单变体包：\`susfs-lkm-loader-${{ steps.build.outputs.tag }}-android12-5.10.zip\` 等，见 Release 附件"
